name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  test:
    name: headless tests (Godot 4.7.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          install -m 0755 "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Import the project
        run: godot --headless --path . --import
      - name: Run the suite
        run: |
          set -o pipefail
          godot --headless --path . --script tests/run_tests.gd 2>&1 | tee run.log
          if grep -q "SCRIPT ERROR" run.log; then echo "::error::a script error was logged"; exit 1; fi
          grep -q "^PASS " run.log
      - name: The demo scene opens
        run: |
          godot --headless --path . --quit-after 60 2>&1 | tee demo.log
          if grep -q "SCRIPT ERROR" demo.log; then echo "::error::the demo logged a script error"; exit 1; fi
